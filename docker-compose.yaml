services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./data-pgadmin:/var/lib/pgadmin
    depends_on:
      - db

  app:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    image: 69-s2-strapi:latest
    container_name: 69-s2-app
    ports:
      - ${APP_PORT}:1337
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      EMAIL_PROVIDER_DEV_HOST: mail
      EMAIL_PROVIDER_DEV_PORT: 1025
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM}
      AUDIT_LOG_PATH: /audit/audit.log
    volumes:
      - ./data-audit:/audit
    depends_on:
      - db
      - mail

  mail:
    image: mailhog/mailhog:latest
    container_name: 69-s2-mail
    ports:
      - ${MAILHOG_SMTP_PORT}:1025
      - ${MAILHOG_WEB_PORT}:8025

volumes:
  data-postgres:
  data-pgadmin: